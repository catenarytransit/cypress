name: Rust compiler checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-check:
    name: Check all Rust targets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Limit parallel dependency builds on memory-constrained hosted runners.
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies and build output
        uses: Swatinem/rust-cache@v2

      - name: Check library, compiler, ingest, query, and test targets
        run: cargo check --locked --all-targets
