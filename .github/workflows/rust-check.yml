name: Rust compiler checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-check:
    name: Check all Rust targets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Limit parallel dependency builds on memory-constrained hosted runners.
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies and build output
        uses: Swatinem/rust-cache@v2

      - name: Check library, compiler, ingest, query, and test targets
        run: cargo check --locked --all-targets

      - name: Test Roaring hybrid mmap index and query
        run: |
          cargo test --locked --lib roaring
          cargo test --locked --bin compiler roaring_token
          cargo test --locked --bin query

      - name: Validate Europe benchmark scripts and workload
        run: |
          bash -n benchmarks/switzerland_ab/run.sh
          python3 -m py_compile benchmarks/switzerland_ab/compare.py benchmarks/switzerland_ab/analyze_logs.py
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          path = Path("benchmarks/switzerland_ab/workload.jsonl")
          cases = [json.loads(line) for line in path.read_text().splitlines() if line.strip()]
          counts = Counter(c["country"] for c in cases)
          assert counts == {"CH": 81, "DE": 50, "FR": 53, "GB": 24, "IT": 26}, counts
          assert len({c["id"] for c in cases}) == len(cases)
          print(counts)
          PY

      - name: Start ScyllaDB for cleanup regression test
        run: |
          docker run -d --name cypress-cleanup-scylla -p 9042:9042 \
            scylladb/scylla:6.2 --smp 2 --memory 1G --overprovisioned 1
          for attempt in $(seq 1 60); do
            if docker exec cypress-cleanup-scylla cqlsh -e 'SELECT release_version FROM system.local'; then
              exit 0
            fi
            sleep 2
          done
          docker logs cypress-cleanup-scylla
          exit 1

      - name: Test cleanup across multiple ScyllaDB pages
        env:
          CYPRESS_TEST_SCYLLA_URI: 127.0.0.1:9042
        run: cargo test --locked --test scylla_cleanup -- --ignored

      - name: Test places_v2 generation publication and failed imports
        env:
          CYPRESS_TEST_SCYLLA_URI: 127.0.0.1:9042
        run: cargo test --locked --test places_v2 -- --ignored

      - name: Show ScyllaDB logs on failure
        if: failure()
        run: docker logs cypress-cleanup-scylla
