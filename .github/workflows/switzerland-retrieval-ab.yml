name: European Cypress memory layout A/B (CH DE FR)

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner label (ubuntu-latest: 16 GiB RAM, 14 GB disk)'
        required: false
        default: 'ubuntu-latest'
        type: string
      cycles:
        description: 'Measured cycles per query'
        required: false
        default: '11'
        type: string
      scylla_memory_mib:
        description: 'Scylla memory MiB (3072 default on public ubuntu-latest)'
        required: false
        default: '3072'
        type: string

permissions:
  contents: read

concurrency:
  group: switzerland-retrieval-ab
  cancel-in-progress: false

jobs:
  europe:
    # Public ubuntu-latest has 4 vCPUs / 16 GiB RAM, but only ~14 GB disk.
    # Provision more disk space by deleting unused hosted-runner toolchains below.
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 360
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      BENCHMARK_CYCLES: ${{ inputs.cycles || '11' }}
      BENCHMARK_SCYLLA_MEMORY_MIB: ${{ inputs.scylla_memory_mib || '3072' }}
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reclaim unused GitHub-hosted Linux toolchains
        if: ${{ runner.environment == 'github-hosted' && runner.os == 'Linux' }}
        shell: bash
        run: |
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf /usr/local/lib/android/sdk /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          echo "Disk space after cleanup:"
          df -h /

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install osmium and benchmark prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool curl

      - name: Validate benchmark files and scripts
        shell: bash
        run: |
          if [[ ! -f benchmarks/switzerland_ab/run.sh ]]; then
            echo "::error::Select branch bench/switzerland-open-geocode-ab in Run workflow."
            exit 1
          fi
          bash -n benchmarks/switzerland_ab/run.sh
          python3 -m py_compile benchmarks/switzerland_ab/compare.py
          python3 - <<'PY'
          from collections import Counter
          import json
          from pathlib import Path
          cases = [json.loads(line) for line in Path('benchmarks/switzerland_ab/workload.jsonl').read_text().splitlines() if line.strip()]
          counts = Counter(case.get('country') for case in cases)
          assert {'CH', 'DE', 'FR'} <= set(counts), counts
          assert len({case['id'] for case in cases}) == len(cases)
          print('Three-country benchmark workload:', dict(counts))
          PY

      - name: Import CH DE FR then compare independent A/B mmap indexes
        shell: bash
        run: bash benchmarks/switzerland_ab/run.sh

      - name: Publish A/B report to Actions summary
        if: always()
        shell: bash
        run: |
          if test -f benchmark_results/switzerland_ab/summary.md; then
            cat benchmark_results/switzerland_ab/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The three-country A/B runner did not finish. See uploaded logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload metrics, per-query results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: europe-cypress-main-vs-packed-mmap
          path: benchmark_results/switzerland_ab/
          retention-days: 30
          if-no-files-found: warn
